<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shoe Stock Watch</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f6f6f7;--ok:#0a7d2c;--bad:#b3261e;--line:#ddd;--acc:#2874f0}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--mut:#999;--card:#1e1e20;--ok:#4cd27a;--bad:#ff7b72;--line:#333;--acc:#7aa7ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:16px;max-width:760px;margin:auto}
h1{font-size:1.3rem;margin:.2em 0}
.mut{color:var(--mut);font-size:.85rem}
.card{background:var(--card);border-radius:10px;padding:12px;margin:10px 0}
.top{display:flex;gap:12px}
.thumb{width:96px;height:96px;border-radius:8px;object-fit:contain;background:#fff;flex:none}
.grow{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-weight:700;padding:2px 10px;border-radius:99px;border:1px solid currentColor;font-size:.85rem}
.ok{color:var(--ok)}.bad{color:var(--bad)}.verdict{font-size:.9rem;margin-top:4px}.verdict.ok{font-weight:600}.verdict.over{color:var(--mut)}
.dim{opacity:.6}
.x{background:none;border:0;color:var(--mut);font-size:1.1rem;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}.x:hover{background:var(--line)}
.lnkb{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit;font-size:.85rem;padding:0}.tag{font-size:.8rem;color:var(--mut);font-weight:600}
.pick{border:2px solid var(--ok)}
a.btn{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:8px;background:var(--acc);color:#fff;text-decoration:none;font-weight:600}
a.lnk{color:var(--acc);font-size:.85rem;margin-right:10px}
.sizes span{display:inline-block;margin:2px 3px 0 0;padding:1px 7px;border-radius:6px;font-size:.8rem;border:1px solid var(--line)}
.sizes .y{color:var(--ok);border-color:var(--ok)}.sizes .n{color:var(--mut);text-decoration:line-through}.sizes .w{font-weight:700;outline:2px solid var(--acc)}
.price{font-size:1.2rem;font-weight:700}
.bd{font-size:.85rem;color:var(--mut);margin-top:4px}
.gal{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
.gal img{height:110px;border-radius:6px;flex:none}
.ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
input[type=number]{width:80px;padding:4px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px}
select{padding:4px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px}
.plan{font-weight:600}
</style></head><body>
<h1>Shoe stock watch <span id="sz"></span></h1>
<div class="mut" id="upd">loading…</div>

<div class="card ctl">
 <label><input type="checkbox" id="only"> in stock only</label>
 <button class="lnkb" id="hidbtn" style="display:none"></button>
</div>
<div class="card" id="pick"></div>
<div class="mut" id="asof"></div>
<div id="items"></div>
<script>
const $=id=>document.getElementById(id);
let data=null,mine=null;const MY_MAX_MIN=180;
const S=(()=>{try{return JSON.parse(localStorage.getItem('prefs')||'{}')}catch(e){return{}}})();
const save=()=>{try{localStorage.setItem('prefs',JSON.stringify(S))}catch(e){}};
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const enc=encodeURIComponent;

async function load(){
  try{data=await (await fetch('status.json?'+Date.now())).json()}catch(e){$('upd').textContent='could not load status.json';return}
  $('sz').textContent='– size '+data.size;
  const age=Math.round((Date.now()-Date.parse(data.updated))/60000);
  $('upd').innerHTML='Last check '+age+' min ago'+(age>45?' <b class="bad">(stale – workflow may have stopped)</b>':'');
  try{mine=await (await fetch('my_prices.json?'+Date.now())).json()}catch(e){mine=null}
  const mAge=mine&&mine.logged_in?Math.round((Date.now()-Date.parse(mine.updated))/60000):null;
  $('asof').innerHTML=mAge===null?'<b class="bad">Your logged-in prices are unavailable</b> (login expired or script not running), so prices shown are Flipkart\'s logged-out list prices.'
    :mAge>MY_MAX_MIN?`<b class="bad">Your logged-in prices are ${Math.round(mAge/60)}h old</b> (script on your Mac stopped?), so list prices are shown.`
    :`Prices are your logged-in Flipkart price (what you pay), updated ${mAge} min ago.`;
  if(S.only!==undefined)$('only').checked=S.only;
  $('only').onchange=()=>{S.only=$('only').checked;save();render()};
  render();
}

// What you pay = your logged-in fsp when fresh, else the logged-out list price (marked).
function calc(i){
  const m=mine&&mine.logged_in&&mine.items&&mine.items[i.name];
  const fresh=m&&m.fsp&&(Date.now()-Date.parse(mine.updated))/6e4<=MY_MAX_MIN;
  return fresh?{base:m.fsp,mine:true}:{base:i.price||0,mine:false};
}

const L=()=>data.limits||{};
function verdict(i,c){
  if(!i.in_stock)return null;
  const lim=L(), b=c.base; let v;
  if(lim.expense&&b<=lim.expense)v={cls:'ok',t:`✓ Buy · ${inr(b)}, fits your ${inr(lim.expense)} expense limit`};
  else if(lim.personal&&b<=lim.personal)v={cls:'ok',t:`✓ Buy · ${inr(b)}, within your ${inr(lim.personal)}`};
  else if(lim.personal)v={cls:'over',t:`${inr(b)} · needs ${inr(b-lim.personal)} off to reach ${inr(lim.personal)}`};
  else v={cls:'ok',t:`${inr(b)}`};
  if(!c.mine)v.t+=' · list price, not yours';
  return v;
}
const hidden=()=>new Set(S.hidden||[]);
function setHidden(name,on){const h=hidden();on?h.add(name):h.delete(name);S.hidden=[...h];save();render()}

function render(){
  const H=hidden(), nHid=data.items.filter(i=>H.has(i.name)).length;
  const hb=$('hidbtn');hb.style.display=nHid?'':'none';hb.textContent=S.showHidden?`hide the ${nHid} hidden`:`${nHid} hidden · show`;hb.onclick=()=>{S.showHidden=!S.showHidden;save();render()};
  let items=data.items.slice();
  if(!S.showHidden)items=items.filter(i=>!H.has(i.name));
  if($('only').checked)items=items.filter(i=>i.in_stock);
  const tier=i=>i.track_only?2:(i.rank?0:1);
  items.sort((a,b)=>(b.in_stock-a.in_stock)||(tier(a)-tier(b))||((a.rank||99)-(b.rank||99))||(calc(a).base-calc(b).base));
  const best=items.find(i=>i.in_stock&&!i.track_only&&!H.has(i.name));
  if(best){const bc=calc(best),bv=verdict(best,bc);
    $('pick').className='card'+(bv.cls==='ok'?' pick':'');
    $('pick').innerHTML=`<div class="mut">Best pick right now</div><b>${best.rank?'#'+best.rank+' ':''}${best.name}</b><div class="verdict ${bv.cls}">${bv.t}</div>`}
  else{$('pick').className='card';$('pick').innerHTML=`<b>Nothing you want is in stock in size ${data.size} right now.</b>`}
  $('items').innerHTML=items.map(i=>{
    const c=calc(i);
    const sizes=Object.entries(i.sizes||{}).map(([s,v])=>`<span class="${v?'y':'n'} ${s==data.size?'w':''}">${s}</span>`).join('');
    const q=enc(i.name.replace(/\(.*\)/,'').trim());
    const photos=(i.photos||[]).map(p=>`<img loading="lazy" src="${p}" alt="buyer photo">`).join('');
    const off=i.mrp?Math.round((1-c.base/i.mrp)*100):0;
    const vd=verdict(i,c), isH=H.has(i.name), tag=i.track_only?'tracking only':(i.rank?'#'+i.rank+' pick':'unranked');
    return `<div class="card${i.in_stock?'':' dim'}"><div class="top">
      <img class="thumb" src="${i.image||''}" alt="">
      <div class="grow"><div class="row"><b>${i.name} <span class="tag">${tag}</span></b>
        <span><span class="badge ${i.in_stock?'ok':'bad'}">${i.in_stock?'IN STOCK':'out'}</span> <button class="x" data-n="${enc(i.name)}" data-h="${isH?0:1}" title="${isH?'Show this shoe again':'Hide this shoe from my view (still tracked)'}">${isH?'↩':'✕'}</button></span></div>
        ${vd?`<div class="verdict ${vd.cls}">${vd.t}</div>`:''}
        <div class="price">${inr(c.base)} <span class="mut">${c.mine?'your price':'list price'}</span></div>
        <div class="bd">${i.mrp?`MRP ${inr(i.mrp)}, −${off}%`:''}${c.mine&&i.price&&i.price!==c.base?` · logged-out list ${inr(i.price)}`:''}</div>
      </div></div>
      <div class="sizes" style="margin-top:6px">${sizes}</div>
      ${i.error?`<div class="bad mut">${i.error}</div>`:''}
      ${photos?`<div class="mut" style="margin-top:6px">Buyer photos (real life, any colour)</div><div class="gal">${photos}</div>`:'<div class="mut" style="margin-top:6px">No buyer photos on Flipkart yet.</div>'}
      <div style="margin-top:6px">
        <a class="lnk" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${q}+on+feet">on-feet photos</a>
        <a class="lnk" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${q}+on+feet+review">YouTube</a>
        <a class="lnk" target="_blank" rel="noopener" href="https://www.reddit.com/search/?q=${q}">Reddit</a></div>
      <a class="btn" href="${i.url}" target="_blank" rel="noopener">${i.in_stock?'Buy on Flipkart':'Open on Flipkart'}</a></div>`}).join('');
}
$('items').addEventListener('click',e=>{const b=e.target.closest('.x');if(b)setHidden(decodeURIComponent(b.dataset.n),b.dataset.h==='1')});
load();setInterval(load,5*60*1000);
</script></body></html>
