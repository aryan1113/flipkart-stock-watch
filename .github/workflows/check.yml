name: check-stock
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: check-stock
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit status
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add docs/status.json
          git diff --cached --quiet || (git commit -m "status $(date -u +%H:%M)" && git pull --rebase -q && git push)
      # GitHub's cron is unreliable here, so each run re-dispatches itself after a pause.
      # The cron above stays as a watchdog to restart the chain if it ever dies.
      - name: Chain next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 240
          # A single transient API error here used to kill the chain for good, so retry.
          for i in 1 2 3 4 5 6; do
            gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" && exit 0
            sleep $((i * 20))
          done
          exit 1
